# Global Gradle execution
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Canonical platform lock
minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.67

# Tooling / quality
checkstyle_version=14.0.0
google_java_format_version=1.36.0
junit_version=6.1.3
archunit_version=1.4.2
asm_version=9.10.1
lwjgl_version=3.4.1
graalvm_version=25.3.4.1
mcp_protocol_version=2026-07-28

# Advanced engines are isolated and disabled unless explicitly enabled.
enable_advanced_engines=false
enable_polyglot_engines=false
enable_native_extensions=false
enable_dev_hotload=false
enable_chaos_engineering=false

# Mod identity
mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=IAMACESIRX
mod_description=AI/human developed NeoForge mod built with the Minecraft Advanced Mod Development Kit.
