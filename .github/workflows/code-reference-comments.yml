name: Gridelyx Code Reference Comments

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Generate project-local reference comments
        # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/code_reference_comments.py
        run: python tools/code_reference_comments.py --fix

      - name: Refresh generated canonical Gradle lock when needed
        run: |
          # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/templates/neoforge-26.2/build.gradle
          if ! git diff --quiet -- templates/neoforge-26.2/build.gradle; then
            # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/build_lock.py
            python tools/build_lock.py --refresh
          fi
          # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/build_lock.py
          python tools/build_lock.py --check

      - name: Verify complete generated state
        # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/code_reference_comments.py
        run: python tools/code_reference_comments.py --check

      - name: Validate patch whitespace
        run: git diff --check

      - name: Show workflow reference patch
        run: |
          # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/tree/main/.github/workflows
          if git diff --quiet -- .github/workflows; then
            echo 'No workflow reference comments require privileged synchronization.'
          else
            echo 'BEGIN WORKFLOW REFERENCE PATCH'
            # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/tree/main/.github/workflows
            git diff -- .github/workflows
            echo 'END WORKFLOW REFERENCE PATCH'
          fi

      - name: Restore workflow files before bot commit
        # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/tree/main/.github/workflows
        run: git restore -- .github/workflows

      - name: Require pull requests to include generated non-workflow comments
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet; then
            echo 'Project-local reference comments are stale.'
            echo 'Run: python tools/code_reference_comments.py --fix'
            git diff --stat
            exit 1
          fi

      - name: Commit synchronized non-workflow comments
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo 'No non-workflow reference-comment changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize project-local code reference links'
          git push
