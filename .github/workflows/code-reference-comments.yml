name: Gridelyx Code Reference Comments

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Repair generator newline preservation
        run: |
          python - <<'PY'
          from pathlib import Path

          # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/code_reference_comments.py
          path = Path("tools/code_reference_comments.py")
          text = path.read_text(encoding="utf-8")

          old_strip = '''def strip_generated_comments(text: str) -> str:
              generated_prefixes = (
              "# Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/",
              "// Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/",
          )
              lines = [
                  line
                  for line in text.splitlines()
                  if not line.lstrip().startswith(generated_prefixes)
              ]
              result = "\\n".join(lines)
              if text.endswith("\\n"):
                  result += "\\n"
              return result
          '''
          new_strip = '''def strip_generated_comments(text: str) -> str:
              generated_prefixes = (
                  "# Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/",
                  "// Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/",
              )
              lines = [
                  line
                  for line in text.splitlines()
                  if not line.lstrip().startswith(generated_prefixes)
              ]
              result = "\\n".join(lines)
              if text.endswith("\\n"):
                  result += "\\n"
              return result
          '''

          old_main = '''        try:
                      original = full_path.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
          
                  updated = transformed_text(path, original, tracked, by_basename, java_roots)
                  if updated == original:
                      continue
          
                  changed.append(path.as_posix())
                  if args.fix:
                      full_path.write_text(updated, encoding="utf-8", newline="\\n")
          '''
          new_main = '''        try:
                      with full_path.open("r", encoding="utf-8", newline="") as handle:
                          original = handle.read()
                  except (UnicodeDecodeError, OSError):
                      continue
          
                  crlf_count = original.count("\\r\\n")
                  remainder = original.replace("\\r\\n", "")
                  if crlf_count and ("\\r" in remainder or "\\n" in remainder):
                      raise ValueError(f"mixed newline conventions are unsupported: {path}")
                  if crlf_count:
                      logical = original.replace("\\r\\n", "\\n")
                      newline = "\\r\\n"
                  elif "\\r" in original:
                      if "\\n" in original:
                          raise ValueError(f"mixed newline conventions are unsupported: {path}")
                      logical = original.replace("\\r", "\\n")
                      newline = "\\r"
                  else:
                      logical = original
                      newline = "\\n"
          
                  updated_logical = transformed_text(path, logical, tracked, by_basename, java_roots)
                  updated = updated_logical if newline == "\\n" else updated_logical.replace("\\n", newline)
                  if updated == original:
                      continue
          
                  changed.append(path.as_posix())
                  if args.fix:
                      with full_path.open("w", encoding="utf-8", newline="") as handle:
                          handle.write(updated)
          '''

          changed = False
          if old_strip in text:
              text = text.replace(old_strip, new_strip)
              changed = True
          if old_main in text:
              text = text.replace(old_main, new_main)
              changed = True
          if changed:
              path.write_text(text, encoding="utf-8", newline="\n")
              print("Repaired generator formatting and newline preservation.")
          else:
              print("Generator newline preservation already repaired.")
          PY

      - name: Generate project-local reference comments
        # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/code_reference_comments.py
        run: python tools/code_reference_comments.py --fix

      - name: Refresh generated canonical Gradle lock when needed
        run: |
          if ! git diff --quiet -- templates/neoforge-26.2/build.gradle; then
            # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/build_lock.py
            python tools/build_lock.py --refresh
          fi
          # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/build_lock.py
          python tools/build_lock.py --check

      - name: Verify complete generated state
        # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/code_reference_comments.py
        run: python tools/code_reference_comments.py --check

      - name: Validate patch whitespace
        run: git diff --check

      - name: Show workflow reference patch
        run: |
          if git diff --quiet -- .github/workflows; then
            echo 'No workflow reference comments require privileged synchronization.'
          else
            echo 'BEGIN WORKFLOW REFERENCE PATCH'
            git diff -- .github/workflows
            echo 'END WORKFLOW REFERENCE PATCH'
          fi

      - name: Restore workflow files before bot commit
        run: git restore -- .github/workflows

      - name: Require pull requests to include generated non-workflow comments
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet; then
            echo 'Project-local reference comments are stale.'
            echo 'Run: python tools/code_reference_comments.py --fix'
            git diff --stat
            exit 1
          fi

      - name: Commit synchronized non-workflow comments
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo 'No non-workflow reference-comment changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize project-local code reference links'
          git push
