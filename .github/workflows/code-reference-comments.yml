name: Gridelyx Code Reference Comments

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-reference-comments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Repair generated-comment cleanup predicate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/code_reference_comments.py")
          text = path.read_text(encoding="utf-8")
          old = '    lines = [line for line in text.splitlines() if MARKER not in line]'
          new = '''    generated_prefixes = (
              "# Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/",
              "// Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/",
          )
              lines = [
                  line
                  for line in text.splitlines()
                  if not line.lstrip().startswith(generated_prefixes)
              ]'''
          if old in text:
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
              print("Repaired generated-comment cleanup predicate.")
          else:
              print("Cleanup predicate already repaired.")
          PY

      - name: Generate project-local reference comments
        run: python tools/code_reference_comments.py --fix

      - name: Verify generated reference comments
        run: python tools/code_reference_comments.py --check

      - name: Validate patch whitespace
        run: git diff --check

      - name: Require pull requests to include generated comments
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet; then
            echo 'Project-local reference comments are stale.'
            echo 'Run: python tools/code_reference_comments.py --fix'
            git diff --stat
            exit 1
          fi

      - name: Commit synchronized comments
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo 'No reference-comment changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize project-local code reference links'
          git push
