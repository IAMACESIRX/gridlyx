name: Gridelyx Native CI

on:
  push:
    paths:
      - 'native/**'
      - 'bedrock/**'
      - 'tools/bedrock_check.py'
      - '.github/workflows/native-ci.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'bedrock/**'
      - 'tools/bedrock_check.py'
      - '.github/workflows/native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate Bedrock/native contracts
        run: python tools/bedrock_check.py
      - name: Rust Gridelyx ABI check
        run: cargo check --manifest-path native/rust/Cargo.toml
      - name: Configure Gridelyx native workspace
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build Gridelyx native workspace
        run: cmake --build build/native --config Release
