name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/copilot-setup-steps.toml
      - platform/versions.json
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/copilot-setup-steps.toml
      - platform/versions.json

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          cache-provider: basic
      - name: Validate platform invariants
        run: python tools/validate_platform.py
      - name: Prime template dependencies
        working-directory: templates/neoforge-26.2
        run: ./gradlew --no-daemon help
