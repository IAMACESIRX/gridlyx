name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/gridelyx-toolchain/**
      - .github/copilot-setup-steps.toml
      - platform/versions.json
      - vault/manifest.json
      - tools/hydrate_references.py
      - tools/redistribution_guard.py
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/gridelyx-toolchain/**
      - .github/copilot-setup-steps.toml
      - platform/versions.json
      - vault/manifest.json
      - tools/hydrate_references.py
      - tools/redistribution_guard.py

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install locked toolchain dynamically
        uses: ./.github/actions/gridelyx-toolchain
      - name: Validate platform invariants
        run: |
          python tools/hydrate_references.py --check
          python tools/redistribution_guard.py
          python tools/validate_platform.py
      - name: Resolve template dependencies from configured upstream providers
        working-directory: templates/neoforge-26.2
        run: gradle --no-daemon --refresh-dependencies help
