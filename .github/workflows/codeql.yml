name: Gridelyx CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 16 * * 3'

permissions:
  contents: read

jobs:
  analyze-java:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          architecture: x64
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
      - name: Analyze Java with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
          output: codeql-sarif
          upload: never
          upload-database: false
      - name: Preserve CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-java-sarif
          path: codeql-sarif
          if-no-files-found: error
          retention-days: 30
