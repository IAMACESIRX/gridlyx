name: Gridelyx CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 16 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze-java:
    # GitHub CodeQL code scanning on private repositories requires GitHub Code Security.
    # Set the repository variable CODEQL_ENABLED=true only after Code Security is enabled.
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          cache-provider: basic
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Java for CodeQL
        working-directory: templates/neoforge-26.2
        run: ./gradlew --no-daemon -Penable_advanced_engines=true spotlessCheck check build
      - name: Analyze Java with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
          output: codeql-sarif
          upload: never
          upload-database: false
      - name: Preserve CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codeql-java-sarif
          path: codeql-sarif
          if-no-files-found: error
          retention-days: 30
