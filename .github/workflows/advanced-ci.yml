name: Advanced Engine CI

on:
  push:
    paths:
      - 'templates/neoforge-26.2/src/advanced/**'
      - 'templates/neoforge-26.2/src/test/**'
      - 'templates/neoforge-26.2/build.gradle'
      - 'templates/neoforge-26.2/gradle.properties'
      - 'platform/**'
      - 'tools/world_editor_check.py'
      - '.github/workflows/advanced-ci.yml'
  pull_request:
    paths:
      - 'templates/neoforge-26.2/src/advanced/**'
      - 'templates/neoforge-26.2/src/test/**'
      - 'templates/neoforge-26.2/build.gradle'
      - 'templates/neoforge-26.2/gradle.properties'
      - 'platform/**'
      - 'tools/world_editor_check.py'
      - '.github/workflows/advanced-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-advanced:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          cache-provider: basic
      - name: Validate locked platform
        run: |
          python tools/build_lock.py --check
          python tools/script_gatekeeper.py
          python tools/validate_platform.py
          python tools/world_editor_check.py
      - name: Compile and test advanced engines
        working-directory: templates/neoforge-26.2
        run: ./gradlew --no-daemon -Penable_advanced_engines=true spotlessCheck check build
      - name: GraalJS polyglot smoke test
        working-directory: templates/neoforge-26.2
        run: ./gradlew --no-daemon -Penable_advanced_engines=true -Penable_polyglot_engines=true polyglotSmokeTest
