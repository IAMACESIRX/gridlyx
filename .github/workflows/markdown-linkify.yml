name: Markdown Linkify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linkify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Convert documentation targets to clickable links
        if: github.event_name != 'pull_request'
        # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/markdown_linkify.py
        run: python tools/markdown_linkify.py --fix

      - name: Verify clickable and resolvable links
        # Gridelyx local reference: https://github.com/IAMACESIRX/gridlyx/blob/main/tools/markdown_linkify.py
        run: python tools/markdown_linkify.py --check

      - name: Check whitespace
        run: git diff --check

      - name: Commit linkified documentation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No documentation targets required conversion."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git commit -m "Make documentation link targets clickable"
          git push origin HEAD:main
