name: Minecraft Mod Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_gametests:
        description: Run opted-in NeoForge GameTest workspaces
        required: false
        default: false
        type: boolean
      advanced:
        description: Compile the isolated advanced-engine source sets
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: minecraft-mod-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up exact Temurin JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          architecture: x64
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          cache-provider: basic
      - name: Check Gradle execution privilege
        run: test -x templates/neoforge-26.2/gradlew
      - name: Validate master Gradle lock
        run: python tools/build_lock.py --check
      - name: Gate non-Java scripts
        run: python tools/script_gatekeeper.py
      - name: Validate multi-language ecosystem
        run: python tools/ecosystem_check.py
      - name: Validate repository invariants
        run: python tools/validate_platform.py
      - name: Automated diagnostics
        run: python tools/diagnose.py --static
      - name: Validate generated documentation
        run: python tools/autodoc.py --check
      - name: Validate AI documentation context
        run: python tools/ai_autodoc.py --self-test
      - name: Validate bytecode analysis tooling
        run: python tools/bytecode_diff.py --self-test
      - name: Validate CSV recipe conversion
        run: python tools/csv_recipe_pipeline.py --self-test
      - name: Build template and all mod workspaces
        run: python tools/build_all.py --include-template ${{ inputs.advanced && '--advanced' || '' }}
      - name: Run opted-in headless GameTests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gametests }}
        run: python tools/headless_validate.py ${{ inputs.advanced && '--advanced' || '' }}
      - name: Upload compiled mod JARs and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: minecraft-mod-build-${{ github.sha }}
          if-no-files-found: warn
          path: |
            templates/neoforge-26.2/build/libs/*.jar
            mods/*/build/libs/*.jar
            templates/neoforge-26.2/build/reports/**
            mods/*/build/reports/**
