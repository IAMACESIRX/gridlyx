name: Minecraft Mod Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_gametests:
        description: 'Run opted-in NeoForge GameTest workspaces'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: minecraft-mod-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up exact Temurin JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+7'
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          cache-provider: basic

      - name: Validate repository invariants
        run: python tools/validate_platform.py

      - name: Build template and all mod workspaces
        run: python tools/build_all.py --include-template

      - name: Run opted-in GameTests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gametests }}
        run: python tools/build_all.py --gametest

      - name: Upload compiled mod JARs and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: minecraft-mod-build-${{ github.sha }}
          if-no-files-found: warn
          path: |
            templates/neoforge-26.2/build/libs/*.jar
            mods/*/build/libs/*.jar
            templates/neoforge-26.2/build/reports/**
            mods/*/build/reports/**
