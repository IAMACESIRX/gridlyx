name: Gridelyx Studio and Project Continuity CI

on:
  push:
    paths:
      - 'studio/**'
      - 'ai/**'
      - 'platform/brand.json'
      - 'platform/terminology.json'
      - 'platform/chat-requirements.json'
      - 'platform/toolchain-requirements.json'
      - 'AI_HANDOFF.md'
      - 'AGENTS.md'
      - 'COMMUNITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SUPPORT.md'
      - 'docs/PROJECT_PLAN.md'
      - 'docs/PROJECT_OVERVIEW.md'
      - 'docs/PROJECT_STRUCTURE.md'
      - 'docs/CHAT_REQUIREMENTS_TRACEABILITY.md'
      - 'docs/DEPENDENCIES_AND_TOOLCHAIN.md'
      - 'docs/CAPABILITY_DEPENDENCY_MATRIX.md'
      - 'docs/REBRAND_PLAN.md'
      - 'docs/community/**'
      - 'docs/ROADMAP.md'
      - 'docs/FEATURE_MAP.md'
      - 'docs/TODO.md'
      - 'docs/ACQUISITION_AND_RESOLUTION.md'
      - 'docs/MACHINIMA_PRODUCTION.md'
      - 'docs/AI_CONTEXT_SYSTEM.md'
      - 'tools/continuity_check.py'
      - 'tools/chat_requirements_check.py'
      - 'tools/toolchain_requirements_check.py'
      - 'tools/terminology_check.py'
      - 'tools/repo_index.py'
      - 'tools/ai_context_pack.py'
      - 'tools/studio_check.py'
      - '.github/workflows/studio-ci.yml'
  pull_request:
    paths:
      - 'studio/**'
      - 'ai/**'
      - 'platform/brand.json'
      - 'platform/terminology.json'
      - 'platform/chat-requirements.json'
      - 'platform/toolchain-requirements.json'
      - 'AI_HANDOFF.md'
      - 'AGENTS.md'
      - 'COMMUNITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SUPPORT.md'
      - 'docs/**'
      - 'tools/continuity_check.py'
      - 'tools/chat_requirements_check.py'
      - 'tools/toolchain_requirements_check.py'
      - 'tools/terminology_check.py'
      - 'tools/repo_index.py'
      - 'tools/ai_context_pack.py'
      - 'tools/studio_check.py'
      - '.github/workflows/studio-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate Gridelyx continuity and brand state
        run: python tools/continuity_check.py
      - name: Validate whole-chat requirements traceability
        run: python tools/chat_requirements_check.py
      - name: Validate dependency and toolchain inventory
        run: python tools/toolchain_requirements_check.py
      - name: Validate staged Gridelyx terminology migration
        run: python tools/terminology_check.py
      - name: Validate Studio architecture and provider policy
        run: python tools/studio_check.py
      - name: Validate AI repository index contract
        run: python tools/repo_index.py --check
      - name: Build deterministic AI repository index
        run: python tools/repo_index.py
      - name: Smoke task-scoped AI context retrieval
        run: python tools/ai_context_pack.py "launcher Java dependency resolution" --limit 5
      - name: Test Studio core
        run: cargo test --manifest-path studio/Cargo.toml --all-targets
