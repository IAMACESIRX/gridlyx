name: Gridelyx Actions History Cleanup

on:
  push:
    paths:
      - '.github/workflows/retired-actions-history-cleanup.yml'

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs predating verified identity scrub
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CLEAN_CUTOFF: '2026-08-28T08:45:45Z'
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          current = int(os.environ['CURRENT_RUN_ID'])
          cutoff = dt.datetime.fromisoformat(os.environ['CLEAN_CUTOFF'].replace('Z', '+00:00'))
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'gridelyx-actions-history-cleanup',
          }

          def request(url: str, method: str = 'GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  payload = response.read()
                  return json.loads(payload) if payload else None

          deleted = 0
          while True:
              data = request(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page=1')
              runs = data.get('workflow_runs', []) if data else []
              candidates = []
              for run in runs:
                  run_id = int(run['id'])
                  if run_id == current:
                      continue
                  created = dt.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
                  if created < cutoff:
                      candidates.append(run_id)
              if not candidates:
                  break
              for run_id in candidates:
                  try:
                      request(
                          f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                          method='DELETE',
                      )
                      deleted += 1
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise

          remaining = request(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page=1')
          old = []
          for run in remaining.get('workflow_runs', []):
              created = dt.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
              if created < cutoff:
                  old.append(run['id'])
          if old:
              raise SystemExit(f'FAIL: pre-scrub workflow runs remain visible on page 1: {old}')

          print(f'Deleted {deleted} workflow runs predating {cutoff.isoformat()}; page 1 is clean.')
          PY
