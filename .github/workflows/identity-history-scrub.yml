name: Gridelyx Identity History Scrub

on:
  push:
    paths:
      - '.github/workflows/identity-history-scrub.yml'

permissions:
  contents: write

jobs:
  scrub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare both branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main gridelyx-rebrand-reload-orchestrator --tags --force
          git checkout --detach
          git branch -f main origin/main
          git branch -f gridelyx-rebrand-reload-orchestrator origin/gridelyx-rebrand-reload-orchestrator

      - name: Remove retired-name paths from current branch tips
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in main gridelyx-rebrand-reload-orchestrator; do
            git switch "$branch"
            python - <<'PY'
          from pathlib import Path
          import subprocess

          low = bytes([118,111,120,101,108,102,111,114,103,101]).decode()
          camel = low[:5].capitalize() + low[5:].capitalize()
          upper = low.upper()
          replacements = ((camel, "Gridelyx"), (upper, "GRIDELYX"), (low, "gridelyx"))

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [p for p in tracked if p]
          tracked_set = set(tracked)
          moves = []
          removes = []
          for path in tracked:
              new_path = path
              for old, new in replacements:
                  new_path = new_path.replace(old, new)
              if new_path == path:
                  continue
              if new_path in tracked_set:
                  removes.append(path)
              else:
                  moves.append((path, new_path))

          for path in removes:
              subprocess.run(["git", "rm", "-f", "--", path], check=True)
          for old_path, new_path in moves:
              Path(new_path).parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", "--", old_path, new_path], check=True)
          PY
            if ! git diff --cached --quiet; then
              git commit -m "Remove retired product identity from current paths"
            fi
          done

      - name: Install history rewrite tool
        run: python -m pip install --disable-pip-version-check git-filter-repo

      - name: Rewrite reachable history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          low = bytes([118,111,120,101,108,102,111,114,103,101]).decode()
          camel = low[:5].capitalize() + low[5:].capitalize()
          upper = low.upper()
          Path('/tmp/gridelyx-replacements.txt').write_text(
              f'{camel}==>Gridelyx\n{upper}==>GRIDELYX\n{low}==>gridelyx\n',
              encoding='utf-8'
          )
          PY

          mapfile -t refs < <(git for-each-ref --format='%(refname)' \
            refs/heads/main \
            refs/heads/gridelyx-rebrand-reload-orchestrator \
            refs/tags)

          git filter-repo --force \
            --replace-text /tmp/gridelyx-replacements.txt \
            --message-callback 'return message.replace(bytes([86,111,120,101,108,70,111,114,103,101]), b"Gridelyx").replace(bytes([86,79,88,69,76,70,79,82,71,69]), b"GRIDELYX").replace(bytes([118,111,120,101,108,102,111,114,103,101]), b"gridelyx")' \
            --filename-callback 'return filename.replace(bytes([86,111,120,101,108,70,111,114,103,101]), b"Gridelyx").replace(bytes([86,79,88,69,76,70,79,82,71,69]), b"GRIDELYX").replace(bytes([118,111,120,101,108,102,111,114,103,101]), b"gridelyx")' \
            --refs "${refs[@]}"

      - name: Verify zero reachable occurrences
        shell: bash
        run: |
          set -euo pipefail
          term="$(python - <<'PY'
          print(bytes([118,111,120,101,108,102,111,114,103,101]).decode())
          PY
          )"

          mapfile -t verify_refs < <(git for-each-ref --format='%(refname)' \
            refs/heads/main \
            refs/heads/gridelyx-rebrand-reload-orchestrator \
            refs/tags)
          mapfile -t commits < <(git rev-list "${verify_refs[@]}")

          if git log "${verify_refs[@]}" --format='%B' | grep -Fii -- "$term"; then
            echo 'Retired identity remains in a rewritten commit message.' >&2
            exit 1
          fi

          if printf '%s\n' "${commits[@]}" | while read -r commit; do git ls-tree -r --name-only "$commit"; done | grep -Fii -- "$term"; then
            echo 'Retired identity remains in a rewritten path.' >&2
            exit 1
          fi

          for commit in "${commits[@]}"; do
            if git grep -I -Fii -n -- "$term" "$commit" -- .; then
              echo "Retired identity remains in rewritten text at $commit." >&2
              exit 1
            fi
          done

      - name: Force-push rewritten branches and tags
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin \
            refs/heads/main:refs/heads/main \
            refs/heads/gridelyx-rebrand-reload-orchestrator:refs/heads/gridelyx-rebrand-reload-orchestrator
          if git show-ref --tags --quiet; then
            git push --force --tags origin
          fi
