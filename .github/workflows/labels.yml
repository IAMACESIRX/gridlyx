name: Sync Gridelyx Labels

on:
  push:
    branches: [main]
    paths:
      - 'platform/label-taxonomy.json'
      - 'tools/sync_labels.py'
      - '.github/workflows/labels.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gridelyx-label-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Synchronize label taxonomy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/sync_labels.py --repo "${{ github.repository }}"
