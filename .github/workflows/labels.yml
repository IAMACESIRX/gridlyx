name: Sync Gridelyx Labels

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Synchronize label taxonomy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/sync_labels.py --repo "${{ github.repository }}"
