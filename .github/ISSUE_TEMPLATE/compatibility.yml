name: Compatibility report
description: Track mod, loader, mapping, JVM, shader or driver compatibility
title: "[Compat]: "
labels: [compatibility]
body:
  - type: input
    id: component
    attributes:
      label: External component / mod
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: matrix
    attributes:
      label: Compatibility matrix / environment
      placeholder: Minecraft, NeoForge, JDK, OS, GPU/driver, other mods.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result and evidence
    validations:
      required: true
